import org.apache.tools.ant.taskdefs.condition.Os
import javax.inject.Inject

plugins {
  id 'java-library'
  id 'groovy'
  id 'maven-publish'
}

defaultTasks 'jar'

group = 'com.github.org-arl'
version = file('VERSION').text.trim()

def commit = providers.exec {
  commandLine 'git', 'describe', '--always', '--abbrev=8', '--match', 'NOT A TAG', '--dirty=*'
  ignoreExitValue = true
}.standardOutput.asText.get().trim() ?: 'unknown'

// ExecOperations for running external commands from task actions
interface InjectedExecOps {
  @Inject ExecOperations getExecOps()
}
def execOps = objects.newInstance(InjectedExecOps).execOps

// true if the command runs and exits with 0
def canRun = { String... cmd ->
  try {
    execOps.exec {
      commandLine cmd
      ignoreExitValue = true
      standardOutput = new ByteArrayOutputStream()
      errorOutput = new ByteArrayOutputStream()
    }.exitValue == 0
  } catch (ignored) {
    false
  }
}

def windows = Os.isFamily(Os.FAMILY_WINDOWS)
def npmcmd = windows ? "npm.cmd" : "npm"
def pythoncmd = System.getenv('PYTHON') ?: (windows ? "python" : "python3")
def pyvenv = layout.buildDirectory.dir('pyvenv').get().asFile
def pyvenvPython = new File(pyvenv, windows ? "Scripts/python.exe" : "bin/python")

java {
  // compile, test and javadoc with JDK 17, whichever JVM runs Gradle
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
  withJavadocJar()
  withSourcesJar()
}

repositories {
  mavenCentral()
}

def jettyVersion = '12.1.14'

dependencies {
  api 'org.apache.groovy:groovy:5.1.3'
  // The jdk11 bundle excludes JLine's Java 22 FFM provider.
  api 'org.jline:jline:4.4.7:jdk11'
  api 'org.apache.commons:commons-lang3:3.21.0'
  api 'commons-io:commons-io:2.22.0'
  api 'io.github.kostaskougios:cloning:1.13.0'
  api "org.eclipse.jetty:jetty-server:$jettyVersion"
  api "org.eclipse.jetty:jetty-rewrite:$jettyVersion"
  api "org.eclipse.jetty.websocket:jetty-websocket-jetty-server:$jettyVersion"
  implementation "org.eclipse.jetty.compression:jetty-compression-server:$jettyVersion"
  runtimeOnly "org.eclipse.jetty.compression:jetty-compression-gzip:$jettyVersion"
  runtimeOnly 'org.slf4j:slf4j-jdk14:2.0.17'
  testImplementation "org.eclipse.jetty.websocket:jetty-websocket-jetty-client:$jettyVersion"
  api 'com.google.code.gson:gson:2.14.0'
  api 'com.fazecast:jSerialComm:2.10.4'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'net.jodah:concurrentunit:0.4.6'
}

[JavaCompile, GroovyCompile].each { type ->
  tasks.withType(type).configureEach { options.compilerArgs << '-Xlint:all' }
}

compileJava {
  options.compilerArgs << '-Xlint:-removal'
}

tasks.register('buildjs') {
  inputs.files fileTree('gateways/js') {
    include 'src/**', '*.json', '*.yaml', 'rollup.config.js', 'eslint.config.js'
  }
  outputs.dir "gateways/js/dist"
  onlyIf {
    def ok = canRun(npmcmd, '-v')
    if (!ok) logger.lifecycle('npm not found. Skipping fjage.js build needed by JS gateway tests.')
    ok
  }
  doLast {
    execOps.exec {
      workingDir 'gateways/js'
      executable npmcmd
      args System.getenv('CI') != null ? 'ci' : "install"
      standardOutput = new ByteArrayOutputStream()
    }
    execOps.exec {
      workingDir 'gateways/js'
      executable npmcmd
      args 'run', 'build'
    }
  }
}

tasks.register('setupPyVenv') {
  inputs.file 'gateways/python/pyproject.toml'
  outputs.dir pyvenv
  onlyIf {
    def ok = canRun(pythoncmd, '--version')
    if (!ok) logger.lifecycle("$pythoncmd not found. Skipping venv setup needed by fjagepy tests.")
    ok
  }
  doLast {
    execOps.exec {
      executable pythoncmd
      args '-m', 'venv', pyvenv
    }
    execOps.exec {
      executable pyvenvPython
      args '-m', 'pip', 'install', '--quiet', '--disable-pip-version-check', '-e', 'gateways/python[dev]'
    }
  }
}

tasks.register('jsdoc', Exec) {
  doFirst {
    if (!canRun(npmcmd, '-v')) throw new GradleException("npm not found. Cannot generate JSDoc.")
  }
  workingDir 'gateways/js'
  commandLine npmcmd, 'run', 'docs'
}

tasks.register('updatexterm') {
  doFirst {
    if (!canRun(npmcmd, '-v')) throw new GradleException("npm not found. Cannot update xterm.")
  }
  doLast {
    // create package.json with `{}` if it does not exist
    if (!file('package.json').exists()) {
      file('package.json').text = '{}'
    }
    execOps.exec {
      workingDir '.'
      executable npmcmd
      args 'install', '@xterm/xterm@6.0.0', '@xterm/addon-attach@0.12.0', '@xterm/addon-fit@0.11.0', '@xterm/addon-web-links@0.12.0'
    }
    copy {
      from(['node_modules/@xterm/addon-web-links/lib', 'node_modules/@xterm/addon-attach/lib', 'node_modules/@xterm/addon-fit/lib', 'node_modules/@xterm/xterm/lib']) {
        include '*.js'
      }
      from('node_modules/@xterm/xterm/css') {
        include 'xterm.css'
      }
      into 'src/main/resources/org/arl/fjage/web/shell'
    }
    delete "node_modules", "package.json", "package-lock.json"
  }
}

jar {
  manifest {
    attributes (
        "Build-Owner": System.getenv('USER') ?: "fjage",
        "Build-Timestamp": new Date().format('d-MM-yyyy_HH:mm:ss'),
        "Build-Version": "${project.version}/${commit}")
  }
  doLast {
    // dependency jars next to the fjage jars, with stale versions removed
    def current = "${archiveBaseName.get()}-${archiveVersion.get()}*.jar"
    sync { spec ->
      spec.from configurations.runtimeClasspath
      spec.into destinationDirectory
      spec.preserve { it.include current }
    }
  }
}

processResources {
  exclude '**/readme.md'
  doLast {
    copy {
      into layout.buildDirectory.dir('libs')
      from configurations.runtimeClasspath
    }
  }
}

tasks.withType(Test).configureEach {
  testLogging {
    events "passed", "skipped", "failed"
    exceptionFormat = "full"
  }
}

test {
  dependsOn 'buildjs', 'setupPyVenv'
  exclude '**/loadtest/**'     // multi-container load tests run on demand via the loadTest task
  doFirst {
    // run fjagepy tests with the venv python
    if (pyvenvPython.exists()) environment 'PYTHON', pyvenvPython.path
  }
  ['manualJSTest', 'manualPyTest', 'manualCTest'].each { name ->
    def value = providers.gradleProperty(name).orNull
    if (value != null) systemProperty name, value
  }
}

tasks.register('encodingTest', Test) {
  description = 'Checks TCP and WebSocket Unicode transport with a non-UTF-8 default charset'
  group = 'verification'
  dependsOn 'buildjs'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/UnicodeConnectionTest.class', '**/WebSocketEncodingTest.class', '**/ShellEncodingTest.class'
  // Every test included in this task runs with a non-UTF-8 JVM default charset.
  defaultCharacterEncoding = 'ISO-8859-1'
}

check.dependsOn 'encodingTest'

tasks.register('loadTest', Test) {
  description = 'Runs multi-container load & fault-injection tests (on demand only, see src/test/java/org/arl/fjage/loadtest/README.md)'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/loadtest/**'
  outputs.upToDateWhen { false }
}

javadoc {
  options.addBooleanOption('Xdoclint:none', true)
  options.quiet()
}

////// publishing to GitHub Packages

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
    }
  }
  repositories {
    maven {
      name = "GitHubPackages"
      url = "https://maven.pkg.github.com/org-arl/fjage"
      credentials {
        username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
        password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
      }
    }
  }
}
