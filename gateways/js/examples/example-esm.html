<html>
    <head>
        <script type="module">
            import { AgentID, Gateway, ShellExecReq } from './node_modules/fjage/dist/esm/fjage.js'
            (async function () {
                const shell = new AgentID('shell');
                const gw = new Gateway({
                    hostname: 'localhost',
                    port : '8080',
                    pathname: '/ws/'
                });
                const req = new ShellExecReq();
                req.recipient = shell;
                req.cmd = 'a=2; a+2;';
                req.ans = true;
                let rsp = await gw.request(req);
                console.log(rsp);
                gw.close();
            })();
        </script>
    </head>
</html>
