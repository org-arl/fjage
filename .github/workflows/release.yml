name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/gradle.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup JDK 1.8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Check tag matches VERSION
        run: |
          VERSION=$(cat VERSION)
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build jars
        run: ./gradlew jar sourcesJar javadocJar
      # Stable releases only, skipped if this version is already in GitHub Packages
      - name: Publish to GitHub Packages
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          POM=https://maven.pkg.github.com/org-arl/fjage/com/github/org-arl/fjage/$VERSION/fjage-$VERSION.pom
          if curl -sf -o /dev/null -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$POM"; then
            echo "fjage $VERSION already published, skipping"
          else
            ./gradlew publish
          fi
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JARS=(build/libs/fjage-$VERSION.jar build/libs/fjage-$VERSION-sources.jar build/libs/fjage-$VERSION-javadoc.jar)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${JARS[@]}" --clobber
            [[ "$GITHUB_REF_NAME" == *-* ]] && gh release edit "$GITHUB_REF_NAME" --prerelease
          else
            FLAGS=()
            [[ "$GITHUB_REF_NAME" == *-* ]] && FLAGS+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "${JARS[@]}" --title "fjage $GITHUB_REF_NAME" --generate-notes "${FLAGS[@]}"
          fi
