name: CI

# Tag pushes run these tests through release.yml
on:
  push:
    branches: ['**']
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: [3.9]
        node-version: [24.x]
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Setup JDK 1.8
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 8
        cache: gradle
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: gateways/python/pyproject.toml
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
        cache-dependency-path: gateways/js/package-lock.json
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Test with Gradle
      run: ./gradlew -i test encodingTest
    - name: Coverage report
      if: runner.os == 'Linux'
      run: ./gradlew jacocoTestReport
    - name: Upload coverage report
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: build/reports/jacoco/test/html
    - name: Coverage summary
      if: runner.os == 'Linux'
      run: |
        awk -F, '
          function row(name, covered, missed) {
            total = covered + missed
            printf "| %s | %d | %d | %.1f%% |\n", name, covered, total, total ? 100 * covered / total : 0
          }
          NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
          END {
            print "### Code coverage\n"
            print "| Counter | Covered | Total | Coverage |"
            print "|---|---:|---:|---:|"
            row("Instructions", ic, im)
            row("Branches", bc, bm)
            row("Lines", lc, lm)
          }
        ' build/reports/jacoco/test/jacocoTestReport.csv >> "$GITHUB_STEP_SUMMARY"
